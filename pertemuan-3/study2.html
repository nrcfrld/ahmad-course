<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Flexbox 2</title>

    <style>
        .kotak {
            background-color: #ffb5b5;
            text-align: center;
            min-height: 80px;
            border-radius: 10px;
        }

        .header {
            display: flex;
            background-color: #032156;
            color: white;
            justify-content: space-between;
            padding: 0 8px 0 8px;
            margin-bottom: 12px;
        }

        .header h1 {
            font-size: 20px;
        }

        .menu {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .kotak-container {
            display: flex;
            gap: 12px;
        }

        .kotak-container .kotak {
            width: 100%;
        }

    </style>
</head>
<body>
    <div class="header">
        <h1>Rina</h1>
        <div class="menu">
            <div>Beranda</div>
            <div>Hobi</div>
            <div>Kontak</div>
        </div>
    </div>
    <div class="kotak-container">
        <div class="kotak">Kartu 1</div>
        <div class="kotak">Kartu 2</div>
        <div class="kotak">Kartu 3</div>
    </div>
</body>
</html>
